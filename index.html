<script>
"use strict";

const topics = window.equineTopics;
const bank = window.equineBank.map(([topic, prompt, options, explanation], id) => ({
  id, topic, prompt, options, explanation
}));
const quotas = { "3": 16, "4": 16, "5": 9, "6": 8, "1": 1, "2": 1 };
const storageKey = "equine-field-guide-prep-v1";
const routes = { dashboard, library, flashcards, practice, exam, progress: progressPage };
const main = document.querySelector("main");
const topicById = new Map(topics.map(topic => [topic.id, topic]));
const blank = () => ({ version: 1, reviewed: [], best: {}, lastTopic: "3", exam: null });
let storageAvailable = true;
let state = restore();
let flash = { topic: "3", at: 0, shown: false };
let quiz = null;
let notice = "";
let confirm = "";

function forTopic(id) {
  return bank.filter(item => item.topic === id);
}

function shuffle(items, draw = Math.random) {
  const output = [...items];
  for (let i = output.length - 1; i > 0; i -= 1) {
    const j = Math.floor(draw() * (i + 1));
    [output[i], output[j]] = [output[j], output[i]];
  }
  return output;
}

function optionOrder(item) {
  let seed = Math.imul(item.id + 161, 2747636419) >>> 0;
  return shuffle([0, 1, 2, 3], () => {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    return seed / 4294967296;
  });
}

function sanitize(data) {
  if (!data || data.version !== 1 || !Array.isArray(data.reviewed) || !data.best || !topicById.has(data.lastTopic)) {
    throw new Error("This is not an Equine Field Guide progress file.");
  }
  const clean = blank();
  clean.lastTopic = data.lastTopic;
  clean.reviewed = [...new Set(data.reviewed.filter(id => topicById.has(id)))];
  for (const topic of topics) {
    const score = data.best[topic.id];
    if (Number.isInteger(score) && score >= 0 && score <= forTopic(topic.id).length) clean.best[topic.id] = score;
  }
  if (data.exam === null) return clean;
  const result = data.exam;
  if (!result || !Array.isArray(result.ids) || result.ids.length !== 51 || new Set(result.ids).size !== 51 ||
      !Array.isArray(result.answers) || result.answers.length !== 51 ||
      !Number.isInteger(result.at) || result.at < 0 || result.at > 50 ||
      typeof result.submitted !== "boolean" ||
      result.ids.some(id => !Number.isInteger(id) || !bank[id] || !quotas[bank[id].topic]) ||
      result.answers.some(answer => answer !== null && (![0, 1, 2, 3].includes(answer)))) {
    throw new Error("The saved mock exam is incomplete or incompatible.");
  }
  for (const [id, count] of Object.entries(quotas)) {
    if (result.ids.filter(index => bank[index].topic === id).length !== count) throw new Error("The saved exam does not match this question bank.");
  }
  clean.exam = { ids: result.ids, answers: result.answers, at: result.at, submitted: result.submitted };
  return clean;
}

function restore() {
  try {
    const raw = localStorage.getItem(storageKey);
    return raw ? sanitize(JSON.parse(raw)) : blank();
  } catch (error) {
    if (error.name === "SecurityError") storageAvailable = false;
    return blank();
  }
}

function save() {
  try {
    localStorage.setItem(storageKey, JSON.stringify(state));
    storageAvailable = true;
  } catch {
    storageAvailable = false;
  }
}

function route() {
  const [view, topic] = location.hash.slice(1).split("/");
  return [Object.hasOwn(routes, view) ? view : "dashboard", topicById.has(topic) ? topic : ""];
}

function go(hash) {
  if (location.hash === `#${hash}`) render(true);
  else location.hash = hash;
}

function render(focus = false) {
  const [view, topic] = route();
  main.innerHTML = routes[view](topic);
  for (const link of document.querySelectorAll("nav a")) {
    if (link.hash === `#${view}`) link.setAttribute("aria-current", "page");
    else link.removeAttribute("aria-current");
  }
  if (focus) focusHeading();
}

function focusHeading() {
  const heading = main.querySelector("h1");
  if (!heading) return;
  heading.tabIndex = -1;
  heading.focus({ preventScroll: true });
  window.scrollTo(0, 0);
}

function action(name, label, tone = "", attrs = "") {
  return `<button type="button" class="btn ${tone}" data-action="${name}" ${attrs}>${label}</button>`;
}

function link(hash, label, tone = "") {
  return `<a href="#${hash}" class="btn ${tone}">${label}</a>`;
}

function intro(title, copy) {
  return `<div class="page-intro"><h1>${title}</h1><p class="muted">${copy}</p></div>`;
}

function tile(topic, destination, label, copy = topic.summary) {
  const isOptional = topic.weight === 0;
  const isPriority = topic.weight === 31;
  const badge = isOptional ? "Optional · 0%" : `${topic.weight}% of blueprint`;
  return `<article class="tile ${isOptional ? "optional" : isPriority ? "hot" : ""}">
    <span class="label ${isOptional ? "gold" : isPriority ? "coral" : ""}">${badge}</span>
    <h3>${topic.name}</h3><p>${copy}</p>
    ${link(`${destination}/${topic.id}`, label, "secondary")}
  </article>`;
}

function dashboard() {
  const reviewed = topics.filter(topic => topic.weight && state.reviewed.includes(topic.id)).length;

    <div class="hero-body"><p class="eyebrow">Equine Science 1 · Exam 127</p>
      <h1>Skills Certification<br>Prep Center</h1>

function library(id) {
  if (!id) return `${intro("Study Library", "Review key ideas, try a field example, and check what you can explain from memory.")}
    <div class="grid">${topics.map(topic => tile(topic, "library", state.reviewed.includes(topic.id) ? "Reopen notes" : "Open notes")).join("")}</div>
    <div class="panel section"><h2>Source materials</h2><p>Utah Equine Science 1 Strands and Standards (revised October 2020) and the 2024 YouScience Equine Science exam blueprint (Exam 127).</p><p class="meta">Performance skills are practiced in this center. Ask your teacher about how to document demonstrations and approved experiences in Canvas.</p></div>`;
  const topic = topicById.get(id);
  state.lastTopic = id;
  save();
  return `<a class="back" href="#library">All study topics</a>
    ${intro(topic.name, `${topic.week} · ${topic.weight}% of the published blueprint`)}
    <section class="panel"><h2>Study notes</h2>
      ${topic.notes.map(([heading, copy]) => `<h3>${heading}</h3><p>${copy}</p>`).join("")}
      <p class="note"><strong>Field example.</strong> ${topic.apply}</p>
    </section>
    <section class="panel"><h2>Recall check</h2><ul>${topic.recall.map(item => `<li>${item}</li>`).join("")}</ul>
      <p><strong>Performance skill.</strong> ${topic.skill}</p>
      <div class="actions">${action("review", state.reviewed.includes(id) ? "Reviewed · Undo" : "Mark as reviewed", "", `data-id="${id}"`)}
        ${link(`flashcards/${id}`, "Open flashcards", "secondary")}${link(`practice/${id}`, "Practice topic", "gold")}</div>
    </section>`;
}

function flashcards(id) {
  if (id && id !== flash.topic) flash = { topic: id, at: 0, shown: false };
  const items = forTopic(flash.topic);
  const current = items[flash.at];
  return `${intro("Flashcards", "Say or write your answer before you reveal it.")}
    <div class="control"><label for="flash-topic">Topic</label>
    <select id="flash-topic">${topics.map(topic => `<option value="${topic.id}" ${topic.id === flash.topic ? "selected" : ""}>${topic.name}</option>`).join("")}</select></div>
    <section class="panel">
      <p class="meta">Card ${flash.at + 1} of ${items.length}</p>
      <div class="reveal" aria-live="polite"><h2>${current.prompt}</h2>
        ${flash.shown ? `<p class="answer">${current.options[0]}</p><p>${current.explanation}</p>` : ""}
      </div>
      <div class="actions">${action("flash-prev", "Previous", "secondary", flash.at === 0 ? "disabled" : "")}
        ${action("flash-flip", flash.shown ? "Hide answer" : "Reveal answer")}
        ${action("flash-next", "Next card", "secondary", flash.at === items.length - 1 ? "disabled" : "")}</div>
    </section>`;
}

function options(question, chosen) {
  return `<fieldset><legend>${question.prompt}</legend><ul class="choices">
    ${optionOrder(question).map(choice => `<li><label class="option"><input type="radio" name="answer" value="${choice}" ${chosen === choice ? "checked" : ""}><span>${question.options[choice]}</span></label></li>`).join("")}
  </ul></fieldset>`;
}

function feedback(question, correct) {
  return `<div class="feedback ${correct ? "" : "retry"}" role="status"><p><strong>${correct ? "Correct." : `Correct answer: ${question.options[0]}.`}</strong> ${question.explanation}</p></div>`;
}

function makeQuiz(id) {
  return { id, items: shuffle(forTopic(id)), at: 0, score: 0, chosen: null, checked: false, done: false };
}

function practice(id) {
  if (!id) return `${intro("Topic Practice", "Choose a topic for immediate feedback on each answer.")}<div class="grid">${topics.map(topic =>
    tile(topic, "practice", "Start practice", `${forTopic(topic.id).length} questions. ${topic.summary}`)).join("")}</div>`;
  if (quiz?.id !== id) quiz = makeQuiz(id);
  const topic = topicById.get(id);
  const question = quiz.items[quiz.at];
  const head = `<a class="back" href="#practice">All practice topics</a>${intro(topic.name, "Topic Practice · Answers are explained as you go.")}`;
  if (quiz.done) return `${head}<section class="panel"><h2>Practice complete</h2>
    <p class="score">${quiz.score} / ${quiz.items.length}</p><p>Best score for this topic: ${state.best[id]} / ${quiz.items.length}</p>
    <div class="actions">${action("quiz-restart", "Practice again")}${link(`library/${id}`, "Review notes", "secondary")}</div></section>`;
  return `${head}<section class="panel"><p class="meta">Question ${quiz.at + 1} of ${quiz.items.length} · ${quiz.score} correct so far</p>
    ${quiz.checked ? `<h2>${question.prompt}</h2><p>Your answer: ${question.options[quiz.chosen]}</p>${feedback(question, quiz.chosen === 0)}
      <div class="actions">${action("quiz-next", quiz.at === quiz.items.length - 1 ? "See results" : "Next question")}</div>` :
      `<form id="quiz-form">${options(question, quiz.chosen)}
        <p id="form-status" role="status"></p>
        <div class="actions"><button class="btn" type="submit">Check answer</button></div></form>`}
  </section>`;
}

function startExam() {
  const ids = Object.entries(quotas).flatMap(([id, count]) => shuffle(forTopic(id)).slice(0, count).map(item => item.id));
  state.exam = { ids: shuffle(ids), answers: Array(ids.length).fill(null), at: 0, submitted: false };
  save();
}

function exam() {
  const attempt = state.exam;
  const head = intro("Mock Certification Exam", "51 original questions. Untimed and ungraded.");
  if (!attempt) return `${head}<section class="panel"><h2>Before you begin</h2>
    <p>Choose an answer for each question. Move between questions to review or change answers before submitting.</p>
    <p>${storageAvailable ? "You can leave and resume in this browser." : "Browser storage is unavailable. Export your progress before leaving."} Results show after submission.</p>
    <p class="note">This mock uses one point per item. It approximates the blueprint mix and gives you study feedback. The official exam lists 55 points.</p>
    <div class="actions">${action("exam-start", "Start 51-question mock exam")}</div></section>`;
  if (attempt.submitted) return examResults(attempt);
  const answerCount = attempt.answers.filter(answer => answer !== null).length;
  const current = bank[attempt.ids[attempt.at]];
  return `${head}<section class="panel">
    <div class="control"><label for="exam-jump">Go to question</label>
      <select id="exam-jump">${attempt.ids.map((_, i) => `<option value="${i}" ${i === attempt.at ? "selected" : ""}>Question ${i + 1}${attempt.answers[i] === null ? " · Unanswered" : " · Answered"}</option>`).join("")}</select>
      <span id="answer-count" class="meta" aria-live="polite">${answerCount} of 51 answered</span>
    </div>
    <progress id="answer-meter" value="${answerCount}" max="51" aria-label="Questions answered"></progress>
    <p class="meta" style="margin-top:12px">Question ${attempt.at + 1} of 51</p>
    <form id="exam-form">${options(current, attempt.answers[attempt.at])}</form>
    <div class="actions">
      ${action("exam-prev", "Previous", "secondary", attempt.at === 0 ? "disabled" : "")}
      ${action("exam-next", "Next question", "", attempt.at === 50 ? "disabled" : "")}
      ${action("exam-finish", "Submit exam", "gold")}
    </div>
    ${confirm === "submit" ? `<div class="note" role="status"><p><strong>${51 - answerCount} unanswered.</strong> Unanswered questions count as incorrect.</p>
      <div class="actions">${action("exam-submit", "Submit now", "gold")}${action("cancel", "Keep working", "secondary")}</div></div>` : ""}
  </section>`;
}

function examResults(attempt) {
  const score = attempt.answers.filter(answer => answer === 0).length;
  const misses = attempt.ids.map((id, i) => [bank[id], attempt.answers[i], i]).filter(([, answer]) => answer !== 0);
  const breakdown = topics.filter(topic => topic.weight > 0).map(topic => {
    const correct = attempt.ids.reduce((total, id, i) => total + Number(bank[id].topic === topic.id && attempt.answers[i] === 0), 0);
    return `<div><strong>${topic.name}</strong><br>${correct} / ${quotas[topic.id]} correct · <a href="#library/${topic.id}">Review notes</a></div>`;
  }).join("");
  return `${intro("Mock Exam Results", "Use this practice score to choose what to study next.")}
    <section class="panel"><p class="score">${score} / 51 · ${Math.round(score * 100 / 51)}%</p><p class="meta">One practice point per item. Official certification scoring differs.</p>
      <h2>Results by topic</h2><div class="results">${breakdown}</div>
    </section>
    <section class="panel"><h2>Review missed items</h2>
      ${misses.length ? misses.map(([item, answer, index]) => `<details><summary>${index + 1}. ${item.prompt}</summary>
        <p><strong>Your answer.</strong> ${answer === null ? "Unanswered" : item.options[answer]}</p><p><strong>Correct answer.</strong> ${item.options[0]}</p><p>${item.explanation}</p></details>`).join("") : "<p>You answered every item correctly.</p>"}
      <div class="actions">${action("exam-restart", "Start a new attempt", "gold")}${link("progress", "Save / Transfer", "secondary")}</div>
      ${confirm === "restart" ? `<div class="note" role="status"><p>A new attempt replaces these saved results. Export your progress first if you want a backup.</p>
       <div class="actions">${action("exam-start", "Replace and start", "gold")}${action("cancel", "Keep these results", "secondary")}</div></div>` : ""}
    </section>`;
}

function progressPage() {
  const attempt = state.exam;
  const result = !attempt ? "No attempt yet" : attempt.submitted ? `${attempt.answers.filter(answer => answer === 0).length} / 51 correct` :
    `In progress · ${attempt.answers.filter(answer => answer !== null).length} of 51 answered`;
  return `${intro("Save or transfer progress", "Export a backup before changing browsers or devices. Importing a backup replaces the progress currently shown here.")}
    <section class="panel">
      <p>${storageAvailable ? "Review status, best topic scores, and your mock exam save automatically in this browser." :
        "Browser storage is unavailable. Download a backup before closing this page."}</p>
      <div class="actions">${action("export", "Export progress (JSON)")}</div>
      <form id="import-form" class="section">
        <label for="import-file"><strong>Choose a saved progress file</strong></label><br>
        <input id="import-file" type="file" accept=".json,application/json" required>
        <div class="actions"><button class="btn secondary" type="submit">Import and replace progress</button></div>
      </form>
      <p id="transfer-status" role="status" class="meta" style="margin-top:10px">${notice}</p>
    </section>
    <section class="panel"><h2>Saved results</h2><p><strong>Mock exam:</strong> ${result}</p>
      <ul class="topic-list">${topics.map(topic => `<li><strong>${topic.name}</strong> · ${state.reviewed.includes(topic.id) ? "Reviewed" : "Unreviewed"}${Object.hasOwn(state.best, topic.id) ? ` · Best practice ${state.best[topic.id]} / ${forTopic(topic.id).length}` : ""}</li>`).join("")}</ul>
    </section>`;
}

function refocus(name) {
  main.querySelector(`[data-action="${name}"]`)?.focus();
}

function downloadProgress() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const anchor = document.createElement("a");
  anchor.href = url;
  anchor.download = "equine-field-guide-progress.json";
  document.body.append(anchor);
  anchor.click();
  anchor.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  notice = "Progress backup downloaded.";
  main.querySelector("#transfer-status").textContent = notice;
}

main.addEventListener("click", event => {
  const trigger = event.target.closest("[data-action]");
  if (!trigger) return;
  const name = trigger.dataset.action;
  switch (name) {
    case "review": {
      const id = trigger.dataset.id;
      state.reviewed = state.reviewed.includes(id) ? state.reviewed.filter(key => key !== id) : [...state.reviewed, id];
      save();
      render();
      refocus(name);
      break;
    }
    case "flash-flip":
    case "flash-next":
    case "flash-prev":
      if (name === "flash-flip") flash.shown = !flash.shown;
      else {
        flash.at += name === "flash-next" ? 1 : -1;
        flash.shown = false;
      }
      render();
      refocus(name === "flash-flip" ? name : "flash-flip");
      break;
    case "quiz-next":
      if (quiz.at === quiz.items.length - 1) {
        quiz.done = true;
        state.best[quiz.id] = Math.max(quiz.score, state.best[quiz.id] ?? 0);
        save();
        render();
        refocus("quiz-restart");
      } else {
        quiz.at += 1;
        quiz.checked = false;
        quiz.chosen = null;
        render();
        main.querySelector("#quiz-form input")?.focus();
      }
      break;
    case "quiz-restart":
      quiz = makeQuiz(quiz.id);
      render(true);
      break;
    case "exam-start":
      startExam();
      confirm = "";
      render(true);
      break;
    case "exam-next":
    case "exam-prev":
      state.exam.at += name === "exam-next" ? 1 : -1;
      confirm = "";
      save();
      render();
      main.querySelector("#exam-form input")?.focus();
      break;
    case "exam-finish":
      if (state.exam.answers.includes(null)) {
        confirm = "submit";
        render();
        refocus("exam-submit");
        break;
      }
      state.exam.submitted = true;
      save();
      render(true);
      break;
    case "exam-submit":
      state.exam.submitted = true;
      confirm = "";
      save();
      render(true);
      break;
    case "exam-restart":
      confirm = "restart";
      render();
      refocus("exam-start");
      break;
    case "cancel": {
      const previous = confirm;
      confirm = "";
      render();
      refocus(previous === "restart" ? "exam-restart" : "exam-finish");
      break;
    }
    case "export":
      downloadProgress();
      break;
  }
});

main.addEventListener("change", event => {
  const input = event.target;
  if (input.id === "flash-topic") go(`flashcards/${input.value}`);
  else if (input.id === "exam-jump") {
    state.exam.at = Number(input.value);
    confirm = "";
    save();
    render();
    main.querySelector("#exam-jump").focus();
  } else if (input.name === "answer" && input.form?.id === "exam-form") {
    const attempt = state.exam;
    attempt.answers[attempt.at] = Number(input.value);
    save();
    const count = attempt.answers.filter(answer => answer !== null).length;
    main.querySelector("#answer-count").textContent = `${count} of 51 answered`;
    main.querySelector("#answer-meter").value = count;
    main.querySelector("#exam-jump").options[attempt.at].textContent = `Question ${attempt.at + 1} · Answered`;
    if (confirm) {
      confirm = "";
      main.querySelector(".note")?.remove();
    }
  }
});

main.addEventListener("submit", async event => {
  const form = event.target;
  event.preventDefault();
  if (form.id === "quiz-form") {
    const selected = form.querySelector("input:checked");
    if (!selected) {
      form.querySelector("#form-status").textContent = "Choose an answer first.";
      return;
    }
    quiz.chosen = Number(selected.value);
    quiz.checked = true;
    quiz.score += Number(quiz.chosen === 0);
    render();
    refocus("quiz-next");
  } else if (form.id === "import-form") {
    const file = form.querySelector("#import-file").files[0];
    try {
      if (!file || file.size > 100000) throw new Error("Choose a valid progress file under 100 KB.");
      state = sanitize(JSON.parse(await file.text()));
      save();
      quiz = null;
      notice = "Progress imported.";
    } catch (error) {
      notice = error instanceof SyntaxError ? "The selected file is not valid JSON." : error.message;
    }
    if (route()[0] === "progress") {
      render();
      main.querySelector("#transfer-status").focus();
    }
  }
});

window.addEventListener("hashchange", () => {
  confirm = "";
  notice = "";
  render(location.hash !== "#main");
});
render();
</script>
</body>
</html>
